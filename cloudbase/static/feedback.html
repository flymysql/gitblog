<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.png">
<title>淘宝证书上传 · 问题反馈</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg:#0b1120; --card:#131c31; --border:#233046; --text:#e2e8f0; --muted:#8fa3bf; --primary:#3b82f6; --primary-2:#8b5cf6; --green:#34d399; --amber:#fbbf24; --red:#f87171; --radius:16px; --shadow:0 10px 40px rgba(0,0,0,.35); }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
body::before { content:''; position: fixed; inset: 0; background: radial-gradient(800px 400px at 15% -10%, rgba(59,130,246,.12), transparent 60%), radial-gradient(700px 400px at 85% 110%, rgba(139,92,246,.10), transparent 60%); pointer-events: none; z-index: 0; }
.app { max-width: 780px; margin: 0 auto; padding: 24px 20px 40px; position: relative; z-index: 1; }
.nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.brand img { width: 30px; height: 30px; border-radius: 8px; }
.nav-links { display: flex; gap: 4px; }
.nav-links a { color: var(--muted); text-decoration: none; font-size: 14px; padding: 8px 14px; border-radius: 10px; transition: all .2s; }
.nav-links a:hover { color: var(--text); background: rgba(255,255,255,.06); }
.nav-links a.active { color: var(--text); background: rgba(59,130,246,.15); }
.mobile-menu-btn { display: none; background: none; border: 1px solid var(--border); color: var(--text); font-size: 20px; padding: 6px 12px; border-radius: 10px; cursor: pointer; }
h1 { font-size: clamp(22px, 4vw, 28px); font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; background: linear-gradient(135deg, #93c5fd, #c4b5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 18px; box-shadow: var(--shadow); }
.card h2 { font-size: 16px; margin-bottom: 14px; }
label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
input, textarea, select { width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit; transition: border-color .2s; }
textarea { min-height: 130px; resize: vertical; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
.row { display: flex; gap: 12px; }
.row > div { flex: 1; }
.submit-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 18px; box-shadow: 0 6px 20px rgba(59,130,246,.3); transition: all .2s; }
.submit-btn:hover { transform: translateY(-2px); }
.submit-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.msg { margin-top: 12px; font-size: 14px; min-height: 20px; }
.msg.ok { color: var(--green); }
.msg.err { color: var(--red); }
.tips { font-size: 13px; color: var(--muted); line-height: 1.8; margin-top: 12px; padding: 12px 14px; background: rgba(59,130,246,.06); border-radius: 10px; }
.tips code { background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 5px; color: #93c5fd; }
.status { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; margin-left: 8px; }
.status-new { background: rgba(248,113,113,.15); color: var(--red); }
.status-processing { background: rgba(251,191,36,.15); color: var(--amber); }
.status-done { background: rgba(52,211,153,.15); color: var(--green); }
.feedback-list { margin-top: 24px; }
.feedback-item { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
.feedback-item .meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.feedback-item .content { font-size: 14px; line-height: 1.6; }
.feedback-item .reply { margin-top: 10px; padding: 10px 14px; background: rgba(52,211,153,.08); border-left: 3px solid var(--green); border-radius: 8px; font-size: 13px; color: #a7f3d0; }
@media (max-width: 768px) {
  .app { padding: 16px; }
  .nav-links { display: none; position: absolute; top: 56px; left: 16px; right: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 8px; flex-direction: column; z-index: 100; box-shadow: var(--shadow); }
  .nav-links.open { display: flex; }
  .nav-links a { padding: 12px 14px; }
  .mobile-menu-btn { display: block; }
  .card { padding: 18px; }
  .row { flex-direction: column; gap: 0; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="nav">
    <div class="brand"><img src="/favicon.png" alt="logo"> 淘宝证书自动上传</div>
    <button class="mobile-menu-btn" id="menu-btn" aria-label="菜单">☰</button>
    <div class="nav-links" id="nav-links">
      <a href="/index.html">🏠 首页</a>
      <a href="/downloads.html">⬇ 下载</a>
      <a href="/feedback.html" class="active">💬 反馈</a>
      <a href="/admin.html">🔐 后台</a>
    </div>
  </nav>

  <h1>💬 问题反馈</h1>
  <p class="sub">遇到问题在这里告诉我们，我们会尽快处理回复。反馈可匿名提交，也可留下联系方式方便我们联系你。</p>

  <div class="card">
    <h2>提交反馈</h2>
    <div class="row">
      <div>
        <label>遇到的问题分类</label>
        <select id="fb-type">
          <option value="bug">🐞 功能异常/Bug</option>
          <option value="upload">📤 证书上传失败</option>
          <option value="suggestion">💡 建议/改进</option>
          <option value="other">📋 其他</option>
        </select>
      </div>
      <div>
        <label>插件版本（可选）</label>
        <input id="fb-version" placeholder="如 1.2.6">
      </div>
    </div>
    <div class="row">
      <div>
        <label>店铺名（可选）</label>
        <input id="fb-shop" placeholder="哪个店铺出现的问题">
      </div>
      <div>
        <label>联系方式（可选，QQ/微信/手机）</label>
        <input id="fb-contact" placeholder="方便我们联系你">
      </div>
    </div>
    <label>问题描述 *</label>
    <textarea id="fb-content" placeholder="请详细描述你遇到的问题：\n1. 操作步骤（先做了什么，后做了什么）\n2. 出现什么现象（报错内容、卡在哪一步）\n3. 订单/证书数量大概多少"></textarea>
    <button class="submit-btn" id="fb-submit">提 交 反 馈</button>
    <div class="msg" id="fb-msg"></div>
    <div class="tips">
      💡 <b>小提示</b>：如果遇到证书上传失败等异常，可以打开插件弹窗 → 点「📦 导出日志包」，把导出的 zip 文件内容一并描述给我们，能大幅加快定位速度。
    </div>
  </div>

  <div class="card feedback-list">
    <h2>最近反馈（仅展示已回复的）</h2>
    <div id="fb-list"><p class="sub">加载中…</p></div>
  </div>
</div>

<script>
document.getElementById('menu-btn').addEventListener('click', () => document.getElementById('nav-links').classList.toggle('open'));
const API = 'https://gitbolg-d7gmnsrw46e011706-1256429518.ap-shanghai.app.tcloudbase.com/tcb-admin';

async function submit() {
  const btn = document.getElementById('fb-submit');
  const msg = document.getElementById('fb-msg');
  const content = document.getElementById('fb-content').value.trim();
  if (content.length < 2) {
    msg.textContent = '请填写问题描述（至少 2 个字）';
    msg.className = 'msg err';
    return;
  }
  btn.disabled = true;
  msg.textContent = '提交中…';
  msg.className = 'msg';
  try {
    const resp = await fetch(API + '/feedback?action=feedback-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type: document.getElementById('fb-type').value,
        version: document.getElementById('fb-version').value.trim(),
        shop: document.getElementById('fb-shop').value.trim(),
        contact: document.getElementById('fb-contact').value.trim(),
        content,
      }),
    });
    const d = await resp.json();
    if (d.ok) {
      msg.textContent = '✅ 反馈已提交，感谢你的反馈！我们会尽快处理。';
      msg.className = 'msg ok';
      document.getElementById('fb-content').value = '';
      document.getElementById('fb-contact').value = '';
      loadPublic();
    } else {
      msg.textContent = d.message || '提交失败，请稍后重试';
      msg.className = 'msg err';
    }
  } catch (e) {
    msg.textContent = '网络错误：' + e.message;
    msg.className = 'msg err';
  }
  btn.disabled = false;
}

async function loadPublic() {
  try {
    const resp = await fetch(API + '/feedback?action=feedback-public');
    const d = await resp.json();
    const list = (d.feedback || []).filter((f) => f.replied && f.public);
    const el = document.getElementById('fb-list');
    if (!list.length) {
      el.innerHTML = '<p class="sub">暂无已回复的反馈</p>';
      return;
    }
    el.innerHTML = list.map((f) => `
      <div class="feedback-item">
        <div class="meta">${fmt(f.ts)} · ${f.type || '反馈'}${f.version ? ' · v' + f.version : ''}</div>
        <div class="content">${escapeHtml(f.content)}</div>
        <div class="reply">👨‍💻 官方回复：${escapeHtml(f.replied)}</div>
      </div>`).join('');
  } catch (e) {
    document.getElementById('fb-list').innerHTML = '<p class="sub">加载失败</p>';
  }
}

function fmt(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleString('zh-CN', { hour12: false });
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

document.getElementById('fb-submit').addEventListener('click', submit);
document.getElementById('fb-content').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) submit();
});
// 从 URL 参数预填（插件反馈入口带 shop/version）
(function prefillFromUrl() {
  try {
    const qs = new URLSearchParams(location.search);
    const shop = qs.get('shop');
    const version = qs.get('version');
    const type = qs.get('type');
    if (shop) document.getElementById('fb-shop').value = shop;
    if (version) document.getElementById('fb-version').value = version;
    if (type) {
      const sel = document.getElementById('fb-type');
      if ([...sel.options].some((o) => o.value === type)) sel.value = type;
    }
    if (shop) {
      document.querySelector('.sub').textContent = `店铺「${shop}」遇到问题？请详细描述，我们会尽快处理。`;
    }
  } catch (e) { /* ignore */ }
})();
loadPublic();
</script>
</body>
</html>
