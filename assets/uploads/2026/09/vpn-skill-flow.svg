<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <rect width="960" height="560" fill="#ffffff"/>

  <!-- 列头 -->
  <rect x="24" y="18" width="430" height="40" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="239" y="45" font-family="system-ui,sans-serif" font-size="18" fill="#1d4ed8" font-weight="700" text-anchor="middle">本机（Node CLI）</text>
  <rect x="506" y="18" width="430" height="40" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="721" y="45" font-family="system-ui,sans-serif" font-size="18" fill="#6d28d9" font-weight="700" text-anchor="middle">你的海外服务器（bash）</text>

  <!-- 本机步骤 -->
  <g font-family="system-ui,sans-serif" font-size="15" fill="#0f172a">
    <rect x="24" y="76" width="430" height="46" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="42" y="105">1. 解析登录方式（优先读 ~/.ssh/config）</text>

    <rect x="24" y="132" width="430" height="46" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="42" y="161">3. 上传 server/*.sh（零交互 + 幂等 + 可 dry-run）</text>

    <rect x="24" y="188" width="430" height="46" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="42" y="217">5. 读回 state.env（必要时 sudo cat 提权读）</text>

    <rect x="24" y="244" width="430" height="46" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="42" y="273">6. 下载 mihomo 内核（直连 → 镜像 → 服务器中转）</text>

    <rect x="24" y="300" width="430" height="46" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="42" y="329">7. 生成 config.yaml / 分享链接 / Clash 订阅</text>

    <rect x="24" y="356" width="430" height="46" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="42" y="385">8. 启动 mihomo + 设置系统代理（可精确还原）</text>

    <rect x="24" y="412" width="430" height="46" rx="9" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="42" y="441" fill="#166534">9. 验证：204 + 出口 IP + 直连对照</text>
  </g>

  <!-- 服务器步骤 -->
  <g font-family="system-ui,sans-serif" font-size="15" fill="#0f172a">
    <rect x="506" y="132" width="430" height="46" rx="9" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="524" y="161">4. 装协议后端 → 起服务 → 开防火墙 → 开 BBR</text>

    <rect x="506" y="188" width="430" height="46" rx="9" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="524" y="217">   并把结果写成 /etc/vpn-skill/state.env</text>

    <rect x="506" y="76" width="430" height="46" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="524" y="105">2. 探测 OS / 架构 / 是否 root / 有无 systemd</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <line x1="454" y1="99" x2="500" y2="99"/>
    <line x1="500" y1="155" x2="454" y2="155"/>
    <line x1="454" y1="211" x2="500" y2="211"/>
    <line x1="454" y1="267" x2="500" y2="267" stroke="#cbd5e1" stroke-dasharray="4 4"/>
    <line x1="454" y1="323" x2="500" y2="323" stroke="#cbd5e1" stroke-dasharray="4 4"/>
    <line x1="454" y1="379" x2="500" y2="379" stroke="#cbd5e1" stroke-dasharray="4 4"/>
    <line x1="454" y1="435" x2="500" y2="435" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  </g>
  <g fill="#94a3b8">
    <polygon points="500,93 512,99 500,105"/>
    <polygon points="454,149 442,155 454,161"/>
    <polygon points="500,205 512,211 500,217"/>
  </g>

  <!-- 图例 -->
  <g font-family="system-ui,sans-serif" font-size="14" fill="#64748b">
    <line x1="24" y1="492" x2="70" y2="492" stroke="#94a3b8" stroke-width="2"/>
    <text x="80" y="497">SSH/SFTP 往返</text>
    <line x1="230" y1="492" x2="276" y2="492" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="286" y="497">本机内部步骤</text>
  </g>

  <!-- 高亮说明 -->
  <rect x="24" y="510" width="912" height="34" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="42" y="533" font-family="system-ui,sans-serif" font-size="15" fill="#92400e">关键：stdout 只放机器可读数据、日志一律走 stderr —— 否则命令替换会把日志当成返回值</text>
</svg>
