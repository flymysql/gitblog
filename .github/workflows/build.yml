name: build

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'post/**'
      - 'data/posts.json'
      - 'assets/js/config.js'
      - 'assets/js/post.js'
      - 'assets/js/pageviews.js'
      - 'assets/js/cloudbase-pv.js'
      - 'post.html'
      - 'index.html'
      - 'scripts/build.mjs'
      - 'scripts/markdown-render.mjs'
      - 'scripts/prerender-post-html.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'sw.js'
      - 'tools/**'
      - 'tool-*.html'
      - 'tools.html'
      - 'tool-kit.html'
      - 'scripts/generate-tool-pages.mjs'
      - 'scripts/tool-page-shell.mjs'
      - 'scripts/backup-cloudbase-data.mjs'
      - '.github/workflows/build.yml'
      - '.github/workflows/backup-cloudbase.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate sitemap / rss / prerender posts
        run: npm run build

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml rss.xml robots.txt manifest.webmanifest data/posts.json data/search.json assets/og post post.html sw.js assets/dist index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: regenerate sitemap / rss [skip ci]"
            git push
          fi

  backup:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    concurrency:
      group: backup-cloudbase
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Pull CloudBase backup
        env:
          COMMENT_ADMIN_SECRET: ${{ secrets.COMMENT_ADMIN_SECRET }}
          COMMENT_ADMIN_SECRET_VAR: ${{ vars.COMMENT_ADMIN_SECRET }}
          CLOUDBASE_HTTP_URL: ${{ secrets.CLOUDBASE_HTTP_URL }}
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        run: node scripts/backup-cloudbase-data.mjs

      - name: Commit backup if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cloudbase-backup/
          if git diff --cached --quiet; then
            echo "No backup changes"
          else
            git commit -m "backup: cloudbase comments and pageviews [skip ci]"
            git push
          fi
