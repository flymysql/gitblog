    <div class="article-body"><p>这是一篇由 DSH gitblog 发布机制自动生成并提交的验证文章，用于确认「写内容 → 推 GitHub → 构建 → 发布」全链路。验证完成后会被自动删除，不会留在博客上。</p>
<ul>
<li>推送方式：GitHub Contents API（与 gitblog 浏览器后台一致）</li>
<li>构建：push 触发 GitHub Actions build 工作流</li>
<li>发布：GitHub Pages 自动部署</li>
</ul>
